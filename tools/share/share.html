<!doctype html>
<html><head><meta charset="utf-8">
<style>
  * { box-sizing: border-box; margin: 0; }
  html, body { width: 1200px; height: 630px; overflow: hidden; }
  body {
    font-family: Inter, system-ui, sans-serif; color: #1c1b19;
    background: #f4f2ee radial-gradient(#d9d4ca 1.3px, transparent 1.4px) 0 0 / 28px 28px;
    position: relative;
  }
  .left { position: absolute; left: 72px; top: 0; bottom: 0; width: 600px; display: flex; flex-direction: column; justify-content: center; }
  .mark { width: 72px; height: 72px; color: #b5521f; margin-bottom: 30px; }
  h1 { font-size: 84px; font-weight: 800; letter-spacing: -2.5px; line-height: 1; }
  .tag { font-size: 31px; font-weight: 500; color: #5a5650; line-height: 1.3; margin-top: 26px; }
  .chips { display: flex; gap: 12px; margin-top: 34px; }
  .chip { font-size: 20px; font-weight: 600; color: #4a4741; background: #fffdf9; border: 2px solid #ddd8ce; border-radius: 12px; padding: 7px 16px; }
  svg.tree { position: absolute; left: 0; top: 0; }
  .root { position: absolute; left: 644px; top: 293px; height: 50px; padding: 0 20px; border-radius: 25px; background: #1c1b19; color: #fff; font-size: 21px; font-weight: 700; display: flex; align-items: center; }
  .br { position: absolute; left: 894px; height: 34px; padding: 0 15px; border-radius: 17px; color: #fff; font-size: 17px; font-weight: 700; display: flex; align-items: center; white-space: nowrap; }
</style></head>
<body>
  <div class="left">
    <svg class="mark" viewBox="0 0 64 64" aria-hidden="true">
      <path d="M20 32 C30 32 30 14 38 14 M20 32 L38 32 M20 32 C30 32 30 50 38 50" fill="none" stroke="currentColor" stroke-width="4.5" stroke-linecap="round"/>
      <rect x="4" y="25" width="20" height="14" rx="7" fill="currentColor"/>
      <rect x="36" y="8.5" width="24" height="11" rx="3.5" fill="currentColor"/>
      <rect x="36" y="26.5" width="24" height="11" rx="3.5" fill="currentColor"/>
      <rect x="36" y="44.5" width="24" height="11" rx="3.5" fill="currentColor"/>
    </svg>
    <h1>The Capital Map</h1>
    <p class="tag">Money, markets and assets —<br>what each one is, and what can kill it.</p>
    <div class="chips"><span class="chip">Map</span><span class="chip">Flows</span><span class="chip">Cartography</span><span class="chip">Quals</span></div>
  </div>
  <svg class="tree" width="1200" height="630" id="tree"></svg>
  <div class="root">Capital System</div>
  <div id="branches"></div>
<script>
  // Same branch hues as assets/app.js (HUES); colour formula matches the site: hsl(h 62% 42%)
  // All thirteen branches, in map order (Foundations · What you can own · Putting it together · How it runs)
  const B = [["Foundation", 215], ["Money & Liquidity", 42], ["Human & Social", 20], ["Digital Assets", 268],
             ["Real Assets", 88], ["Fixed Income", 192], ["Equities", 152], ["Derivatives", 338], ["Portfolio & Risk", 300], ["When Things Fail", 0],
             ["Markets & Plumbing", 172], ["Measure", 240], ["In Practice", 120]];
  const top0 = 24, gap = 44.5, x0 = 832, y0 = 318, x1 = 894;
  let paths = "", html = "";
  B.forEach(([name, h], i) => {
    const y = top0 + i * gap + 17, c = `hsl(${h} 62% 42%)`;
    paths += `<path d="M${x0} ${y0} C ${x0 + 40} ${y0}, ${x1 - 40} ${y}, ${x1} ${y}" fill="none" stroke="${c}" stroke-width="3"/>`;
    html += `<div class="br" style="top:${y - 17}px;background:${c}">${name}</div>`;
  });
  document.getElementById("tree").innerHTML = paths;
  document.getElementById("branches").innerHTML = html;
</script>
</body></html>
